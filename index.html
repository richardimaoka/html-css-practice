<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Header Demo</title>
    <style>
      /* Reset and Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f4f4f9;
      }

      /* The Sticky Header */
      header {
        position: sticky;
        top: 0;
        z-index: 1000;

        /* Glassmorphism Effect */
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      nav a {
        margin-left: 20px;
        text-decoration: none;
        color: #007bff;
        font-weight: 500;
      }

      /* Page Content */
      .hero {
        height: 400px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
      }

      main {
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      section {
        margin-bottom: 3rem;
      }

      footer {
        text-align: center;
        padding: 2rem;
        color: #777;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>BrandLogo</h2>
      <nav>
        <a href="#">Home</a>
      </nav>
    </header>
    <div style="height: 2500px"></div>
  </body>
</html>
