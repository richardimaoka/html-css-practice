<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrollable Container Demo</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        background-color: #f0f0f0;
      }

      .scroll-container {
        max-width: 600px;
        width: 100%;
        height: 3000px;
        background: linear-gradient(to bottom, #ffffff, #e0e0e0);
        border: 1px solid #ccc;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 20px;
        box-sizing: border-box;
      }

      /* Fixed UI Panel Overlay */
      .ui-panel {
          position: fixed;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 100%;
          max-width: 600px;
          height: 100vh;
          pointer-events: none; /* Allows scrolling the background */
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          align-items: flex-end;
          padding: 40px 20px;
          box-sizing: border-box;
          z-index: 10;
          background: rgba(255, 255, 255, 0.9);
      }
      .button-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
        pointer-events: auto; /* Re-enables interaction for buttons */
      }

      .ui-button {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
      }

      .ui-button:hover {
        background: rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="ui-panel">
      <div class="button-group">
        <button class="ui-button">Like</button>
        <button class="ui-button">Share</button>
        <button class="ui-button">Menu</button>
      </div>
    </div>

    <div class="scroll-container">
      <h1>Scrollable Content</h1>
      <p>This container has a max-width of 600px and a height of 3000px.</p>

      <button
        onclick="alert('Button inside scroll container clicked!')"
        style="
          padding: 10px 20px;
          font-size: 16px;
          cursor: pointer;
          margin-top: 50px;
          position: relative;
          z-index: 1;
        "
      >
        Test Click Me (Inside Scroll Container)
      </button>

      <div style="margin-top: 200px">
        Keep scrolling to see the UI panel stay fixed...
      </div>
    </div>
  </body>
</html>
